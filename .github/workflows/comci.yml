name: 컴시간 시간표 수집

on:
  schedule:
    # 학교 시간(한국 07~18시, 월~금)에 15분마다. GitHub 사정으로 몇 분씩 늦어질 수 있어요.
    - cron: '*/15 22-23 * * 0-4'
    - cron: '*/15 0-9 * * 1-5'
    # 그 외에는 하루 몇 번만
    - cron: '0 12,15,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comci
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comci
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "컴시간 시간표 갱신"
            git push
          fi
